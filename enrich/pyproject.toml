[project]
name = "falkenbergs-bibliotek"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Låst till 1.x: 2.x är en brytande major-release och ingen av
    # säkerhetsfixarna kräver den. Höj medvetet, inte som sidoeffekt.
    "google-genai>=1.62,<2",
    "pydantic",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
]

[tool.uv]
# Minimigränser för TRANSITIVA beroenden med kända sårbarheter (OSV, sep 2026).
# Constraints gäller bara om paketet redan dras in — de lägger inte till nya.
constraint-dependencies = [
    "cryptography>=50.0.0",  # 13 CVE:er i 46.0.4
    "urllib3>=2.7.0",
    "idna>=3.15",
    "pyasn1>=0.6.4",
]

[project.scripts]
enrich = "abstract_enrichment:main"
enrich-directus = "enrich_from_directus:main"
enrich-smart = "enrich_smart:main"
