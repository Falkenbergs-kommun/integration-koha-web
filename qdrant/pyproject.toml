[project]
name = "koha-qdrant-sync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Låst till 2.x: 3.x är en brytande major-release och ingen av
    # säkerhetsfixarna kräver den. Höj medvetet, inte som sidoeffekt.
    "openai>=2.29,<3",
    # Måste hålla sig inom 1 minor från serverversionen (qdrant-klienten
    # kräver samma major och minor-diff <= 1, se common/version_check.py).
    # Servern kör 1.16.2 -> klienten får vara 1.15-1.17. Höj detta FÖRST
    # när Qdrant-servern uppgraderats, annars går skrivvägen i ospecificerat läge.
    "qdrant-client>=1.17,<1.18",
    "fastembed>=0.3",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# Minimigränser för TRANSITIVA beroenden med kända sårbarheter (OSV, sep 2026).
constraint-dependencies = [
    "anyio>=4.14.2",  # TLS-certifikatspoofing via IDNA 2003-kodade värdnamn
                      # (GHSA-82r6-8w77-94w6), fixad i 4.14.2. Dras in av httpx.
    "pillow>=12.3.0",  # 36 CVE:er i 12.1.1 (dras in av fastembed)
    "urllib3>=2.7.0",
    "idna>=3.15",
    "h2>=4.4.1",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "requests>=2.33.0",
]
# fastembed (alla versioner t.o.m. 0.9) kräver pillow<13 för sina bildmodeller.
# Repot använder bara BM25 (text) och importerar aldrig Pillow, medan 12.3 har
# ~40 kända sårbarheter (bl.a. heap overflow i JPEG/FPX). Provat 2026-10-24:
# BM25 och testsviten fungerar med 13.0. Ta bort när fastembed släpper gränsen.
override-dependencies = ["pillow>=13"]

[project.scripts]
sync-qdrant = "sync_to_qdrant:main"
